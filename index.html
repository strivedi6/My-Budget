<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>My Budget</title>
<meta name="theme-color" content="#F2F2F7">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="My Budget">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Pick light or dark before the page draws, so it never flashes the wrong colour.
  (function () { try {
    var p = JSON.parse(localStorage.getItem('mb_prefs') || '{}');
    var a = p.appearance || 'auto';
    var d = a === 'dark' || (a === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
    var s = JSON.parse(localStorage.getItem('mb_state') || 'null');
    var acc = s && s.settings && s.settings.accent;
    if (acc) document.documentElement.setAttribute('data-accent', acc.charAt(0) === '#' ? 'custom' : acc);
    if (acc && acc.charAt(0) === '#') document.documentElement.style.setProperty('--accent', acc);
  } catch (e) {} })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Please turn on JavaScript to use this app.</noscript>
<script src="config.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script src="calc.js"></script>
<script src="icons.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="screens.js"></script>
<script src="settings.js"></script>
<script src="motion.js"></script>
<script>App.start();</script>
</body>
</html>
